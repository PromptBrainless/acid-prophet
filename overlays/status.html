<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="refresh" content="8"/>
  <title>Acid Prophet Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: transparent;
      font-family: 'Rajdhani', system-ui, sans-serif;
      color: #f0f0f0;
      overflow: hidden;
    }
    .panel {
      background: linear-gradient(135deg, #E76F51cc, #E76F5199);
      backdrop-filter: blur(8px);
      border: 1px solid #E76F51;
      border-radius: 12px;
      padding: 14px 22px;
      margin: 12px;
      box-shadow: 0 0 24px #E76F5166;
      min-width: 420px;
      max-width: 640px;
    }
    .brand {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.18em;
      opacity: 0.85;
      margin-bottom: 6px;
    }
    .energy {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }
    .genre {
      font-size: 18px;
      font-weight: 600;
      margin-top: 2px;
    }
    .mood {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 4px;
    }
    .track {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f033;
      font-size: 15px;
    }
    .track .label {
      font-size: 11px;
      letter-spacing: 0.12em;
      opacity: 0.7;
      margin-right: 8px;
    }
    .track .meta {
      display: block;
      font-size: 13px;
      opacity: 0.8;
      margin-top: 2px;
    }
    .community {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="brand">ACID PROPHET</div>
    <div class="energy">Energy 7/10</div>
    <div class="genre">Psytrance</div>
    <div class="mood">intensiv / treibend · 138–150 BPM</div>
    
    
  </div>
</body>
</html>
